name: P015 bidirectional RF-shaping gate

on:
  push:
    branches:
      - 'assistant/p015-*'
    paths:
      - 'deploy/analyze_rf_shaping_ab.py'
      - 'tests/test_p015_rf_shaping_ab.py'
      - '.github/workflows/p015-rf-shaping.yml'
  pull_request:
    branches:
      - p009-hardening
    paths:
      - 'deploy/analyze_rf_shaping_ab.py'
      - 'tests/test_p015_rf_shaping_ab.py'
      - '.github/workflows/p015-rf-shaping.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rf-shaping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile P015 analyzer and tests
        run: |
          python3 -m py_compile \
            deploy/analyze_rf_shaping_ab.py \
            tests/test_p015_rf_shaping_ab.py
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Run P015 regression tests
        run: python3 -m pytest -q tests/test_p015_rf_shaping_ab.py
