name: P013 route-health gate

on:
  push:
    branches:
      - 'assistant/p013-*'
    paths:
      - 'deploy/analyze_route_health.py'
      - 'deploy/analyze_concentrator_ab.py'
      - 'tests/test_p013_route_health.py'
      - 'tests/test_p013_concentrator_ab.py'
      - '.github/workflows/p013-route-health.yml'
  pull_request:
    branches:
      - p009-hardening
    paths:
      - 'deploy/analyze_route_health.py'
      - 'deploy/analyze_concentrator_ab.py'
      - 'tests/test_p013_route_health.py'
      - 'tests/test_p013_concentrator_ab.py'
      - '.github/workflows/p013-route-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile P013 analyzers and tests
        run: |
          python3 -m py_compile \
            deploy/analyze_route_health.py \
            deploy/analyze_concentrator_ab.py \
            tests/test_p013_route_health.py \
            tests/test_p013_concentrator_ab.py
      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Run P013 regression tests
        run: python3 -m pytest -q tests/test_p013_route_health.py tests/test_p013_concentrator_ab.py
      - name: Verify route-health CLI hard-failure semantics
        run: |
          printf '%s\n' '[2026-09-12 12:00:00] info: ROUTE_ERROR_MANY_TO_ONE_ROUTE_FAILURE for "49550".' | python3 deploy/analyze_route_health.py --fail-hard >/tmp/route.json
          grep -q '"verdict": "ROUTING_CHURN"' /tmp/route.json
          set +e
          printf '%s\n' '[2026-09-12 12:00:01] warning: An ID conflict was detected for network address 25066.' | python3 deploy/analyze_route_health.py --fail-hard >/tmp/hard.json
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"verdict": "HARD_REGRESSION"' /tmp/hard.json
